<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZM9X6CN8YK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-ZM9X6CN8YK');</script>
    <title>Your Hidden Ceiling Result | Your Journey Coach</title>
    <meta name="description" content="See your Hidden Ceiling assessment result and discover which leadership pattern is quietly limiting your impact.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="My Hidden Ceiling Result | Your Journey Coach">
    <meta property="og:description" content="Discover which leadership pattern is quietly limiting your impact.">
    <meta property="og:image" content="https://journeycoach.co/assets/images/about_john.jpg">
    <meta property="og:url" content="https://journeycoach.co/results.html">
    <link rel="canonical" href="https://journeycoach.co/results.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css?v=10">
    <link rel="stylesheet" href="css/style.css?v=10">
    <link rel="stylesheet" href="css/responsive.css?v=10">
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/favicon.png">
    <style>
        .results-wrap { max-width: 780px; margin: 0 auto; padding: 8rem 1.5rem 5rem; }
        .results-eyebrow { font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-accent-gold); font-weight: 600; margin-bottom: 0.6rem; }
        .results-title { font-family: var(--font-heading); font-size: clamp(1.8rem, 4vw, 2.6rem); color: var(--color-text-primary); margin: 0 0 1rem; line-height: 1.2; }
        .results-summary { font-size: 1.1rem; color: var(--color-text-secondary); line-height: 1.75; margin-bottom: 2.5rem; }
        .results-card { background: var(--color-bg-secondary); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 2rem; margin-bottom: 1.5rem; }
        .results-card-label { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-accent-gold); font-weight: 600; margin-bottom: 0.75rem; }
        .results-card p { color: var(--color-text-secondary); font-size: 0.97rem; line-height: 1.75; margin: 0; }
        .results-steps { list-style: none; padding: 0; margin: 0; }
        .results-steps li { color: var(--color-text-secondary); font-size: 0.97rem; line-height: 1.7; padding: 0.6rem 0 0.6rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); position: relative; }
        .results-steps li:last-child { border-bottom: none; }
        .results-steps li::before { content: '→'; position: absolute; left: 0; color: var(--color-accent-gold); }
        .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
        .score-card { background: var(--color-bg-secondary); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 1.25rem 1rem; text-align: center; }
        .score-card.is-primary { border-color: var(--color-accent-gold); background: color-mix(in srgb, var(--color-accent-gold) 8%, var(--color-bg-secondary)); }
        .score-card strong { display: block; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 0.5rem; font-weight: 500; }
        .score-card span { font-size: 2rem; font-weight: 700; color: var(--color-text-primary); font-family: var(--font-heading); }
        .cta-block { background: color-mix(in srgb, var(--color-accent-gold) 8%, var(--color-bg-secondary)); border: 1px solid rgba(199,169,107,0.2); border-top: 3px solid var(--color-accent-gold); border-radius: 0 0 8px 8px; padding: 2rem; margin-top: 2.5rem; text-align: center; }
        .cta-block h3 { font-family: var(--font-heading); font-size: 1.35rem; color: var(--color-text-primary); margin: 0 0 0.75rem; }
        .cta-block p { color: var(--color-text-secondary); font-size: 0.92rem; line-height: 1.65; margin-bottom: 1.5rem; }
        .share-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 2.5rem; flex-wrap: wrap; }
        .share-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-muted); }
        .share-btn { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 1rem; border-radius: 4px; font-size: 0.82rem; font-weight: 500; text-decoration: none; border: 1px solid transparent; cursor: pointer; background: none; transition: opacity .2s; }
        .share-btn-linkedin { background: #0A66C2; color: #fff; }
        .share-btn-x { background: #000; color: #fff; border-color: rgba(255,255,255,.15); }
        .share-btn-copy { background: rgba(255,255,255,.06); color: var(--color-text-secondary); border-color: rgba(255,255,255,.1); }
        .share-btn-copy.copied { color: #6fcf97; border-color: rgba(111,207,151,.3); }
        .retake-link { display: block; text-align: center; margin-top: 2rem; font-size: 0.85rem; color: var(--color-text-muted); }
        .retake-link a { color: var(--color-accent-gold); text-decoration: none; }
        .error-state { text-align: center; padding: 6rem 1rem; }
        .error-state p { color: var(--color-text-secondary); margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div class="loader-wrapper"><div class="breathing-circle"></div></div>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo" id="nav-logo">
                <img src="/assets/images/logo.png" alt="Your Journey Coach" class="logo-img">
            </a>
            <ul class="nav-links" id="nav-links-list"></ul>
            <div class="hamburger" id="hamburger" aria-label="Open navigation menu" role="button">
                <span></span><span></span><span></span>
            </div>
        </div>
    </nav>

    <main>
        <div class="results-wrap" id="results-wrap">
            <div id="results-loading" style="text-align:center;padding:4rem 0;">
                <div style="width:40px;height:40px;border:3px solid rgba(201,169,110,0.2);border-top-color:var(--color-accent-gold);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 1rem;"></div>
                <p style="color:var(--color-text-muted);font-size:0.9rem;">Loading your results…</p>
            </div>
            <div id="results-content" style="display:none;"></div>
            <div id="results-error" class="error-state" style="display:none;">
                <p>We couldn't load your results. The link may be invalid or expired.</p>
                <a href="/Hidden-Ceiling.html" class="btn-primary">Take the Assessment</a>
            </div>
        </div>
    </main>

    <footer style="padding:3rem 0;background:var(--color-bg-primary);border-top:1px solid rgba(255,255,255,0.05);">
        <div class="container" style="text-align:center;">
            <p style="color:var(--color-text-muted);font-size:0.85rem;margin:0;">© <span id="footer-year"></span> Your Journey Coach · <a href="/" style="color:var(--color-accent-gold);text-decoration:none;">journeycoach.co</a></p>
        </div>
    </footer>

    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script src="js/main.js" defer></script>
    <script src="js/nav.js" defer></script>
    <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();

    const RESULT_META = {
        heart: {
            centerLabel: 'Heart Center',
            title: 'You lead like a Connection-Oriented Leader',
            summary: 'Your responses point to a leadership pattern that instinctively tracks people, morale, and the emotional temperature of the room.',
            description: 'You are often the person who can sense the undercurrent nobody else is naming. That makes you a stabilizing presence in culture, trust, and relationship repair.',
            blindspot: 'Under pressure, that same strength can turn into over-identifying with how others are feeling, over-functioning relationally, or softening hard decisions until the moment has passed.',
            nextSteps: [
                'Notice where harmony is becoming more important than clarity.',
                "Name the decision before you manage everyone's reaction to it.",
                'Use the guide to spot the situations where connection quietly turns into self-protection.'
            ],
            guideUrl: '/assets/downloads/hidden_ceiling_connection_oriented_leader.pdf',
            guideLabel: 'Hidden Ceiling Guide for the Connection-Oriented Leader'
        },
        head: {
            centerLabel: 'Head Center',
            title: 'You lead like a Thinking-Oriented Leader',
            summary: 'Your responses point to a leadership pattern that instinctively searches for clarity, logic, and the cleanest explanation of what is happening.',
            description: 'You likely bring rigor, objectivity, and strong pattern recognition to complex systems. People rely on you to see risk, ask the smart question, and think around corners.',
            blindspot: 'Under pressure, that strength can become over-analysis, emotional distance, or a subtle dependence on certainty before moving. The room can feel managed by logic but not fully led through tension.',
            nextSteps: [
                'Watch for the moment information-gathering becomes a delay tactic.',
                'Pair your analysis with a visible relational read on the team.',
                'Use the guide to identify where objectivity is protecting you from discomfort rather than serving the decision.'
            ],
            guideUrl: '/assets/downloads/hidden_ceiling_thinking_oriented_leader.pdf',
            guideLabel: 'Hidden Ceiling Guide for the Thinking-Oriented Leader'
        },
        action: {
            centerLabel: 'Gut Center',
            title: 'You lead from the Gut Center',
            summary: 'Your responses point to a leadership pattern that instinctively values movement, decisiveness, and the ability to convert energy into results.',
            description: 'You likely create traction quickly. People experience you as someone who can cut through noise, set direction, and keep a team from stalling out in uncertainty.',
            blindspot: 'Under pressure, that strength can harden into impatience, over-control, or the urge to move faster than the system around you can metabolize. Speed starts solving anxiety instead of solving the right problem.',
            nextSteps: [
                'Notice where urgency is outrunning reflection or buy-in.',
                'Slow down long enough to separate momentum from reactivity.',
                'Use the guide to spot where force and clarity are getting conflated inside your leadership.'
            ],
            guideUrl: '/assets/downloads/hidden_ceiling_action_oriented_leader.pdf',
            guideLabel: 'Hidden Ceiling Guide for the Action-Oriented Leader'
        }
    };

    (async function init() {
        const params = new URLSearchParams(window.location.search);
        const center = params.get('center');
        const name   = params.get('name') || 'Leader';
        const sh     = parseInt(params.get('sh'), 10) || 0;
        const sd     = parseInt(params.get('sd'), 10) || 0;
        const sa     = parseInt(params.get('sa'), 10) || 0;

        if (!center || !RESULT_META[center]) {
            document.getElementById('results-loading').style.display = 'none';
            document.getElementById('results-error').style.display = 'block';
            return;
        }

        // Fetch DB-configured result content (admin overrides)
        let result_content = null;
        try {
            const res = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'hidden_ceiling', preview: center })
            });
            const data = await res.json();
            if (data.ok && data.result_content) result_content = data.result_content;
        } catch (_) {}

        const defaults = RESULT_META[center];
        const rc = result_content || {};
        const meta = {
            centerLabel: rc.centerLabel || defaults.centerLabel,
            title:       rc.title       || defaults.title,
            summary:     rc.summary     || defaults.summary,
            description: rc.description || defaults.description,
            blindspot:   rc.blindspot   || defaults.blindspot,
            nextSteps:   (rc.nextSteps && rc.nextSteps.length) ? rc.nextSteps : defaults.nextSteps,
            guideUrl:    defaults.guideUrl,
            guideLabel:  defaults.guideLabel
        };

        // Update page meta for sharing
        document.title = `${meta.title} | Your Journey Coach`;
        document.querySelector('meta[property="og:title"]').setAttribute('content', `${meta.title} | Your Journey Coach`);
        document.querySelector('meta[property="og:description"]').setAttribute('content', meta.summary);

        const scores = [
            { label: 'Heart', value: sh, key: 'heart' },
            { label: 'Head',  value: sd, key: 'head' },
            { label: 'Gut',   value: sa, key: 'action' }
        ];

        const pageUrl = encodeURIComponent(window.location.href);
        const shareText = encodeURIComponent(`I just took the Hidden Ceiling assessment by @journeycoach — ${meta.title}`);

        document.getElementById('results-content').innerHTML = `
            <p class="results-eyebrow">${meta.centerLabel} · ${name}'s Result</p>
            <h1 class="results-title">${meta.title}</h1>
            <p class="results-summary">${meta.summary}</p>

            <div class="score-grid">
                ${scores.map(s => `
                    <div class="score-card ${s.key === center ? 'is-primary' : ''}">
                        <strong>${s.label}</strong>
                        <span>${s.value}</span>
                    </div>`).join('')}
            </div>

            <div class="results-card">
                <div class="results-card-label">Your Leadership Pattern</div>
                <p>${meta.description}</p>
            </div>

            <div class="results-card">
                <div class="results-card-label">Your Blindspot Under Pressure</div>
                <p>${meta.blindspot}</p>
            </div>

            <div class="results-card">
                <div class="results-card-label">Next Steps</div>
                <ul class="results-steps">
                    ${meta.nextSteps.map(s => `<li>${s}</li>`).join('')}
                </ul>
            </div>

            <div class="results-card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
                <div>
                    <div class="results-card-label">Your Guide</div>
                    <p style="margin:0;">${meta.guideLabel}</p>
                </div>
                <a href="${meta.guideUrl}" download class="btn-primary" style="white-space:nowrap;">Download Guide</a>
            </div>

            <div class="cta-block">
                <h3>Ready to break through your ceiling?</h3>
                <p>A 30-minute assessment call gives us a clear picture of where you are, what is limiting your impact, and whether coaching is the right next step for you.</p>
                <a href="#" id="results-calendly-btn" class="btn-primary" style="display:none;" target="_blank" rel="noopener noreferrer">Book a Free Assessment Call</a>
            </div>

            <div class="share-row">
                <span class="share-label">Share your result</span>
                <a href="https://www.linkedin.com/sharing/share-offsite/?url=${pageUrl}" target="_blank" rel="noopener noreferrer" class="share-btn share-btn-linkedin">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.07 2.07 0 1 1 0-4.14 2.07 2.07 0 0 1 0 4.14zM7.12 20.45H3.55V9h3.57v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46C23.21 24 24 23.23 24 22.28V1.72C24 .77 23.21 0 22.23 0z"/></svg>
                    LinkedIn
                </a>
                <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${pageUrl}" target="_blank" rel="noopener noreferrer" class="share-btn share-btn-x">
                    <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px;"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.259 5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                    Share on X
                </a>
                <button class="share-btn share-btn-copy" id="copy-link-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copy Link
                </button>
            </div>

            <p class="retake-link"><a href="/Hidden-Ceiling.html">Retake the assessment</a></p>
        `;

        document.getElementById('results-loading').style.display = 'none';
        document.getElementById('results-content').style.display = 'block';

        // Copy link
        document.getElementById('copy-link-btn').addEventListener('click', function() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                this.textContent = '✓ Copied!';
                this.classList.add('copied');
                setTimeout(() => { this.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;display:inline;vertical-align:middle;margin-right:4px;"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy Link'; this.classList.remove('copied'); }, 2000);
            }).catch(() => {});
        });

        // Load Calendly URL from API config
        try {
            const cfgRes = await fetch('/api/contact?action=config');
            if (cfgRes.ok) {
                const cfg = await cfgRes.json();
                if (cfg.calendly_url) {
                    const btn = document.getElementById('results-calendly-btn');
                    btn.href = cfg.calendly_url;
                    btn.style.display = 'inline-flex';
                    const email = (() => { try { return sessionStorage.getItem('hc_result_email'); } catch(_){return null;} })();
                    if (email) {
                        btn.addEventListener('click', () => {
                            fetch('/api/contact', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action:'track_click', email }) }).catch(()=>{});
                        });
                    }
                }
            }
        } catch (_) {}
    })();
    </script>
</body>
</html>
