<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Posts — Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    @media (max-width: 700px) { .card { overflow-x: auto; } table { min-width: 480px; } }
  </style>
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <a href="/" class="brand">Your Journey Coach <span>Admin</span></a>
      <div class="admin-header-actions">
        <div class="global-search">
          <input type="text" id="globalSearchInput" placeholder="Search admin..." autocomplete="off">
          <div id="globalSearchResults" class="global-search-results"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <nav class="admin-nav" aria-label="Admin sections">
      <a href="dashboard.html">Dashboard</a>
      <a href="posts.html" class="active">Blog</a>
      <a href="testimonials.html">Testimonials</a>
      <a href="tools.html">Tools</a>
      <a href="identity-ceiling.html">Identity Ceiling</a>
      <a href="bookmarks.html">Bookmarks</a>
      <a href="lead-dashboard.html">Reporting</a>
      <a href="site.html">Site</a>
      <a href="contacts.html">Contacts</a>
      <a href="subscribers.html">Subscribers</a>
    </nav>

    <main class="admin-main">
      <div class="admin-page-title">
        <h1>Leadership ideas &amp; publishing</h1>
        <a href="dashboard.html" class="back-link">&#8592; Dashboard</a>
      </div>

      <section id="studio" aria-label="Private leadership workspace" hidden></section>
      <div style="margin-bottom:16px;">
        <a href="post-edit.html" class="btn btn-primary">+ New Post</a>
      </div>

      <details class="card" open>
        <summary class="card-title" style="cursor:pointer;">All Posts</summary>
        <p class="td-muted" id="postsCount">Showing the 3 most recent posts.</p>
        <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Date</th>
              <th>Author</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="postsBody">
            <tr><td colspan="4" class="table-empty">Loading...</td></tr>
          </tbody>
        </table>
        </div>
        <button type="button" id="togglePosts" class="btn btn-secondary btn-sm" style="margin-top:12px;" hidden>Show older posts</button>
      </details>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <link rel="stylesheet" href="css/ideas.css?v=1">
  <script type="module" src="js/ideas.js?v=3"></script>
  <script>
    requireAdminAuth();

    async function deletePost(id) {
      if (!confirm('Delete this post? This cannot be undone.')) return;
      const res = await adminFetch('/api/admin/posts', {
        method: 'DELETE',
        body: JSON.stringify({ id })
      });
      if (res.ok) {
        showFlash('Post deleted.');
        loadPosts();
      } else {
        showFlash('Error deleting post.', 'error');
      }
    }

    let allPosts = [];
    let showAllPosts = false;
    document.getElementById('togglePosts').addEventListener('click', () => {
      showAllPosts = !showAllPosts;
      renderPosts();
    });

    async function loadPosts() {
      const res = await adminFetch('/api/admin/posts');
      const data = await res.json();
      allPosts = (data.data || []).sort((a, b) =>
        (Date.parse(b.post_date) || 0) - (Date.parse(a.post_date) || 0) || Number(b.id) - Number(a.id));
      renderPosts();
    }

    function renderPosts() {
      const tbody = document.getElementById('postsBody');
      const visiblePosts = showAllPosts ? allPosts : allPosts.slice(0, 3);
      const toggle = document.getElementById('togglePosts');
      toggle.hidden = allPosts.length <= 3;
      toggle.textContent = showAllPosts ? 'Show only the 3 most recent' : 'Show older posts';
      toggle.setAttribute('aria-expanded', String(showAllPosts));
      document.getElementById('postsCount').textContent = `Showing ${visiblePosts.length} of ${allPosts.length} posts, most recent first.`;
      if (allPosts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="table-empty">No posts yet. <a href="post-edit.html">Create one.</a></td></tr>';
        return;
      }
      tbody.innerHTML = visiblePosts.map(p => `
        <tr>
          <td>${escHtml(p.title)}</td>
          <td class="td-muted">${formatDate(p.post_date)}</td>
          <td class="td-muted">${escHtml(p.author || '—')}</td>
          <td class="td-actions">
            <a href="post-edit.html?id=${parseInt(p.id, 10)}" class="btn btn-secondary btn-sm">Edit</a>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${parseInt(p.id, 10)})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    loadPosts();
  </script>
</body>
</html>
