<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Posts — Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <a href="/index.html" class="brand">Your Journey Coach <span>Admin</span></a>
      <div class="admin-header-actions">
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-page-title">
        <h1>Blog Posts</h1>
        <a href="dashboard.html" class="back-link">&#8592; Dashboard</a>
      </div>

      <div style="margin-bottom:16px;">
        <a href="post-edit.html" class="btn btn-primary">+ New Post</a>
      </div>

      <div class="card">
        <div class="card-title">All Posts</div>
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Date</th>
              <th>Author</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="postsBody">
            <tr><td colspan="4" class="table-empty">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script>
    requireAdminAuth();

    async function deletePost(id) {
      if (!confirm('Delete this post? This cannot be undone.')) return;
      const res = await adminFetch('/api/admin/posts', {
        method: 'DELETE',
        body: JSON.stringify({ id })
      });
      if (res.ok) {
        showFlash('Post deleted.');
        loadPosts();
      } else {
        showFlash('Error deleting post.', 'error');
      }
    }

    async function loadPosts() {
      const res = await adminFetch('/api/admin/posts');
      const data = await res.json();
      const tbody = document.getElementById('postsBody');
      if (!data.data || data.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="table-empty">No posts yet. <a href="post-edit.html">Create one.</a></td></tr>';
        return;
      }
      tbody.innerHTML = data.data.map(p => `
        <tr>
          <td>${escHtml(p.title)}</td>
          <td class="td-muted">${formatDate(p.post_date)}</td>
          <td class="td-muted">${escHtml(p.author || '—')}</td>
          <td class="td-actions">
            <a href="post-edit.html?id=${p.id}" class="btn btn-secondary btn-sm">Edit</a>
            <button class="btn btn-danger btn-sm" onclick="deletePost(${p.id})">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    loadPosts();
  </script>
</body>
</html>
