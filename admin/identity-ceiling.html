<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity Ceiling Assessment — Admin</title>
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--admin-border); padding-bottom: 0; }
    .tab-btn { background: none; border: none; border-bottom: 2px solid transparent; color: var(--admin-muted); cursor: pointer; font-size: 1rem; padding: 10px 16px; transition: all 0.2s; font-weight: 500; }
    .tab-btn:hover { color: var(--admin-text); }
    .tab-btn.active { color: var(--admin-accent); border-bottom-color: var(--admin-accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card-title-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .card-title-header h3 { margin: 0; font-size: 1.1rem; color: var(--admin-text); }
    .option-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .option-row input { flex: 1; }
    .option-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--admin-accent) 15%, transparent); color: var(--admin-accent); border: 1px solid var(--admin-accent); font-weight: 600; white-space: nowrap; min-width: 120px; text-align: center; }
    .save-bar { position: sticky; bottom: 0; background: var(--admin-bg); padding: 16px 0; border-top: 1px solid var(--admin-border); margin-top: 20px; display: flex; justify-content: flex-end; z-index: 100; }
    .loading-state { text-align: center; padding: 40px; color: var(--admin-muted); }
  </style>
</head>
<body>
  <div class="admin-wrapper">
    <header class="admin-header">
      <a href="/" class="brand">Your Journey Coach <span>Admin</span></a>
      <div class="admin-header-actions">
        <div class="global-search">
          <input type="text" id="globalSearchInput" placeholder="Search admin..." autocomplete="off">
          <div id="globalSearchResults" class="global-search-results"></div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <nav class="admin-nav" aria-label="Admin sections">
      <a href="dashboard.html">Dashboard</a>
      <a href="posts.html">Blog</a>
      <a href="testimonials.html">Testimonials</a>
      <a href="tools.html">Tools</a>
      <a href="bookmarks.html">Bookmarks</a>
      <a href="lead-dashboard.html">Reporting</a>
      <a href="site.html">Site</a>
      <a href="contacts.html">Contacts</a>
      <a href="subscribers.html">Subscribers</a>
      <a href="identity-ceiling.html" class="active">Identity Ceiling</a>
    </nav>

    <main class="admin-main">
      <div class="admin-page-title">
        <h1>Identity Hidden Ceiling Assessment</h1>
        <a href="dashboard.html" class="back-link">&#8592; Dashboard</a>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="questions" onclick="switchTab('questions')">Questions</button>
        <button class="tab-btn" data-tab="profiles" onclick="switchTab('profiles')">Result Profiles</button>
      </div>

      <div id="loading" class="loading-state">Loading assessment data...</div>

      <form id="assessmentForm" style="display: none;">
        <div id="questionsTab" class="tab-content active">
          <!-- Render 10 questions + tie breaker -->
          <div id="questionsContainer"></div>
        </div>

        <div id="profilesTab" class="tab-content">
          <!-- Render 6 profiles -->
          <div id="profilesContainer"></div>
        </div>

        <div class="save-bar">
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
        </div>
      </form>

    </main>
  </div>

  <script src="js/admin.js"></script>
  <script>
    requireAdminAuth();

    let assessmentData = {
      questions: [],
      profiles: []
    };

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`.tab-btn[data-tab="${tabId}"]`).classList.add('active');
      document.getElementById(`${tabId}Tab`).classList.add('active');
    }

    async function loadData() {
      try {
        const res = await adminFetch('/api/admin/settings?resource=identity-ceiling');
        if (!res.ok) throw new Error('Failed to load assessment data');
        // API returns { questions: [...], results: {...} } directly (no .data wrapper)
        const json = await res.json();
        assessmentData = {
          questions: json.questions || [],
          results: json.results || {}
        };
        renderData();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('assessmentForm').style.display = 'block';
      } catch (err) {
        document.getElementById('loading').textContent = 'Error loading data: ' + err.message;
      }
    }

    function renderData() {
      const qContainer = document.getElementById('questionsContainer');
      const pContainer = document.getElementById('profilesContainer');
      
      qContainer.innerHTML = '';
      pContainer.innerHTML = '';

      // Render Questions
      (assessmentData.questions || []).forEach((q, qIndex) => {
        const isTieBreaker = q.is_tie_breaker || q.id === 'tie_breaker' || qIndex >= 10;
        const qTitleStr = isTieBreaker ? 'Tie-Breaker Question' : `Question ${qIndex + 1}`;
        
        let html = `
          <div class="card">
            <div class="card-title-header">
              <h3>${qTitleStr}</h3>
            </div>
            <div class="form-group">
              <label>Title</label>
              <input type="text" value="${escapeHtml(q.title)}" onchange="updateQuestionTitle(${qIndex}, this.value)" required />
            </div>
            <div class="form-group">
              <label>Options</label>
        `;

        (q.options || []).forEach((opt, oIndex) => {
          html += `
            <div class="option-row">
              <input type="text" value="${escapeHtml(opt.text)}" onchange="updateQuestionOption(${qIndex}, ${oIndex}, this.value)" required />
              <div class="option-badge" title="Mapping: ${escapeHtml(opt.ceiling || 'None')}">${escapeHtml(opt.ceiling || 'None')}</div>
            </div>
          `;
        });

        html += `
            </div>
          </div>
        `;
        qContainer.innerHTML += html;
      });

      // Render Result Profiles (results is a keyed object, not an array)
      Object.entries(assessmentData.results || {}).forEach(([key, p]) => {
        const steps = Array.isArray(p.steps) ? p.steps : ['', '', ''];
        let html = `
          <div class="card">
            <div class="card-title-header">
              <h3>${escapeHtml(p.label || key)}</h3>
              <div class="option-badge" style="min-width:80px;">${escapeHtml(key)}</div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Label</label>
                <input type="text" value="${escapeHtml(p.label)}" onchange="updateProfileKey('${key}', 'label', this.value)" required />
              </div>
            </div>
            <div class="form-group">
              <label>Diagnosis</label>
              <textarea rows="3" onchange="updateProfileKey('${key}', 'diagnosis', this.value)" required>${escapeHtml(p.diagnosis)}</textarea>
            </div>
            <div class="form-group">
              <label>The Ceiling</label>
              <textarea rows="3" onchange="updateProfileKey('${key}', 'ceiling', this.value)" required>${escapeHtml(p.ceiling)}</textarea>
            </div>
            <div class="form-group">
              <label>Core Pattern (shown in italics)</label>
              <input type="text" value="${escapeHtml(p.pattern)}" onchange="updateProfileKey('${key}', 'pattern', this.value)" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>The Cost</label>
                <textarea rows="2" onchange="updateProfileKey('${key}', 'cost', this.value)">${escapeHtml(p.cost)}</textarea>
              </div>
              <div class="form-group">
                <label>The Shift</label>
                <textarea rows="2" onchange="updateProfileKey('${key}', 'shift', this.value)">${escapeHtml(p.shift)}</textarea>
              </div>
            </div>
            <div class="form-group">
              <label>Development Step 1</label>
              <textarea rows="2" onchange="updateProfileStep('${key}', 0, this.value)">${escapeHtml(steps[0])}</textarea>
            </div>
            <div class="form-group">
              <label>Development Step 2</label>
              <textarea rows="2" onchange="updateProfileStep('${key}', 1, this.value)">${escapeHtml(steps[1])}</textarea>
            </div>
            <div class="form-group">
              <label>Development Step 3</label>
              <textarea rows="2" onchange="updateProfileStep('${key}', 2, this.value)">${escapeHtml(steps[2])}</textarea>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>CTA Text (optional)</label>
                <input type="text" value="${escapeHtml(p.cta_text || '')}" placeholder="Schedule an Alignment Call" onchange="updateProfileKey('${key}', 'cta_text', this.value)" />
              </div>
              <div class="form-group">
                <label>CTA URL (optional)</label>
                <input type="text" value="${escapeHtml(p.cta_url || '')}" placeholder="https://calendly.com/..." onchange="updateProfileKey('${key}', 'cta_url', this.value)" />
              </div>
            </div>
          </div>
        `;
        pContainer.innerHTML += html;
      });
    }

    function updateQuestionTitle(qIndex, val) {
      assessmentData.questions[qIndex].title = val;
    }

    function updateQuestionOption(qIndex, oIndex, val) {
      assessmentData.questions[qIndex].options[oIndex].text = val;
    }

    // Update a scalar field on a result profile
    function updateProfileKey(key, field, val) {
      if (!assessmentData.results[key]) assessmentData.results[key] = {};
      assessmentData.results[key][field] = val;
    }

    // Update an individual step inside a profile's steps array
    function updateProfileStep(key, stepIndex, val) {
      if (!assessmentData.results[key]) assessmentData.results[key] = {};
      if (!Array.isArray(assessmentData.results[key].steps)) {
        assessmentData.results[key].steps = ['', '', ''];
      }
      assessmentData.results[key].steps[stepIndex] = val;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    document.getElementById('assessmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';
      
      try {
        const res = await adminFetch('/api/admin/settings?resource=identity-ceiling', {
          method: 'PUT',
          body: JSON.stringify({
            questions: assessmentData.questions,
            results: assessmentData.results
          })
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.error || 'Failed to save');
        }
        showFlash('Assessment updated successfully.');
      } catch (err) {
        showFlash(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    });

    loadData();
  </script>
</body>
</html>
