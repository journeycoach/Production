<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Your Journey Coach</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <div class="admin-login-page">
    <div class="admin-login">
      <div class="login-brand">
        <h1>Your Journey Coach</h1>
        <p>Admin Panel</p>
      </div>
      <div class="login-error" id="loginError">Invalid password. Please try again.</div>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter admin password" autocomplete="current-password" required />
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;">Sign In</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const ADMIN_SESSION_MARKER_KEY = 'admin_session_active';
    const LEGACY_ADMIN_TOKEN_KEY = 'admin_token';

    function setAdminSessionMarker(active) {
      if (active) {
        localStorage.setItem(ADMIN_SESSION_MARKER_KEY, '1');
      } else {
        localStorage.removeItem(ADMIN_SESSION_MARKER_KEY);
      }
    }

    function consumeLegacyAdminToken() {
      const token = localStorage.getItem(LEGACY_ADMIN_TOKEN_KEY);
      if (!token) return false;

      try {
        const [payload] = token.split('.');
        if (!payload) throw new Error('Invalid token');

        const expires = parseInt(atob(payload), 10);
        if (!Number.isFinite(expires) || Date.now() >= expires) {
          throw new Error('Expired token');
        }

        setAdminSessionMarker(true);
        localStorage.removeItem(LEGACY_ADMIN_TOKEN_KEY);
        return true;
      } catch {
        localStorage.removeItem(LEGACY_ADMIN_TOKEN_KEY);
        return false;
      }
    }

    function hasValidAdminSession() {
      return localStorage.getItem(ADMIN_SESSION_MARKER_KEY) === '1' || consumeLegacyAdminToken();
    }

    async function redirectIfAuthenticated() {
      if (!hasValidAdminSession()) return;

      try {
        const res = await fetch('/api/admin/auth', {
          method: 'GET',
          credentials: 'same-origin'
        });
        if (res.ok) {
          setAdminSessionMarker(true);
          window.location.href = '/admin/dashboard.html';
          return;
        }
      } catch {
        // Ignore and keep the login form visible.
      }

      setAdminSessionMarker(false);
      localStorage.removeItem(LEGACY_ADMIN_TOKEN_KEY);
    }

    redirectIfAuthenticated();

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const password = document.getElementById('password').value;
      loginBtn.textContent = 'Signing in...';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/admin/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          setAdminSessionMarker(true);
          localStorage.removeItem(LEGACY_ADMIN_TOKEN_KEY);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorEl.style.display = 'block';
          loginBtn.textContent = 'Sign In';
          loginBtn.disabled = false;
        }
      } catch (err) {
        errorEl.textContent = 'Network error. Please try again.';
        errorEl.style.display = 'block';
        loginBtn.textContent = 'Sign In';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
