    <style>
        .tools-header {
            padding-top: 120px;
            padding-bottom: 36px;
            text-align: center;
            background-color: var(--color-bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-section {
            margin-top: 4rem;
            margin-bottom: 2rem;
        }

        .category-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: var(--color-accent-gold);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.5rem;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 1.25rem;
        }

        .category-section.books-section .tools-grid {
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .tool-card {
            background: var(--color-bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--color-accent-gold-dim);
        }

        .tool-card.image-only {
            background: transparent;
            border: none;
            box-shadow: none;
        }

        .category-section.books-section .tool-card.image-only {
            max-width: 240px;
            justify-self: center;
        }

        .tool-card-image {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tool-card.image-only .tool-card-image {
            border-bottom: none;
        }

        .tool-card.link-with-image .tool-card-image {
            border-bottom: none;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tool-card.link-with-image .tool-card-body {
            padding: 0.75rem 0.75rem 0.6rem;
            gap: 0.3rem;
        }

        .tool-card.link-with-image .tool-type-badge {
            margin-bottom: 0.15rem;
        }

        .tool-card.link-with-image h3 {
            margin-bottom: 0.15rem;
        }

        .tool-card.link-with-image p {
            -webkit-line-clamp: 2;
        }

        .tool-card-body {
            padding: 0.875rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .tool-type-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: inline-block;
            padding: 3px 7px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--color-text-primary);
        }

        .tool-type-badge.pdf {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .tool-type-badge.link {
            background: rgba(199, 169, 107, 0.15);
            color: var(--color-accent-gold);
        }

        .tool-card h3 {
            font-size: 0.95rem;
            margin-bottom: 0.4rem;
            color: var(--color-text-primary);
            line-height: 1.3;
        }

        .tool-card p {
            color: var(--color-text-secondary);
            font-size: 0.8rem;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
                gap: 0.9rem;
            }

            .category-section.books-section .tools-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1rem;
            }

            .tool-card.link-with-image .tool-card-body,
            .tool-card-body {
                padding: 0.7rem;
            }

            .tool-card h3 {
                font-size: 0.9rem;
                margin-bottom: 0.3rem;
            }

            .tool-card p {
                font-size: 0.75rem;
            }
        }
    </style>
</head>

<body>

                <span></span>
                <span></span>

    <main>
        <!-- Header -->
        <section class="tools-header">

                <h1 class="reveal-text delay-100">Tools for the Journey</h1>

                    style="color: var(--color-text-secondary); max-width: 600px; margin: 1rem auto 0 auto;">
                    Explore curated worksheets, guides, and recommended readings to support your continuous growth.
                </p>
            </div>
        </section>

        <!-- Tools Grid Area -->
        <section class="container" style="min-height: 400px; padding-bottom: 6rem;">
            <div id="tools-container">
                <p style="text-align: center; margin-top: 4rem; color: var(--color-text-muted);">
                    Loading resources...
                </p>
            </div>
        </section>
    </main>

    <footer

            <!-- Footer Logo -->

                <img src="assets/images/logo.webp" alt="Your Journey Coach" class="footer-logo">
            </a>
            <nav id="footer-nav-links" style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;"></nav>
            <p style="color: var(--color-text-muted); font-size: 0.9rem;">&copy; <span id="footer-year"></span> Your Journey Coach. All Rights Reserved.</p>
            <div style="display: flex; gap: 1.5rem;">
                <a href="/privacy.html" style="color: var(--color-text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.3s ease;" onmouseover="this.style.color='var(--color-accent-gold)'" onmouseout="this.style.color='var(--color-text-muted)'">Privacy Policy</a>
                <a href="/admin" style="color: var(--color-text-muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; transition: color 0.3s ease;"
                    onmouseover="this.style.color='var(--color-accent-gold)'"
                    onmouseout="this.style.color='var(--color-text-muted)'">Admin Login</a>
