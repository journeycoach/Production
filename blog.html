<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZM9X6CN8YK"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-ZM9X6CN8YK');</script>
    <title>Blog | Your Journey Coach</title>
    <meta name="description"
        content="Insights on leadership, enneagram, and navigating transitions from Your Journey Coach.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Blog | Your Journey Coach">
    <meta property="og:description" content="Insights on leadership, enneagram, and navigating transitions from Your Journey Coach.">
    <meta property="og:image" content="https://journeycoach.co/assets/images/about_john.jpg">
    <meta property="og:url" content="https://journeycoach.co/blog.html">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Third-Party Preconnects -->
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://www.google-analytics.com">

    <!-- Styles -->
    <link rel="stylesheet" href="css/variables.css?v=11">
    <link rel="stylesheet" href="css/style.css?v=11">
    <link rel="stylesheet" href="css/responsive.css?v=11">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="apple-touch-icon" href="assets/images/favicon.png">
    <link rel="canonical" href="https://journeycoach.co/blog.html" id="canonical-url">

    <style>
        .blog-header {
            padding-top: 120px;
            padding-bottom: 36px;
            text-align: center;
            background-color: var(--color-bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            padding: 3rem 0;
        }

        .blog-card {
            background: var(--color-bg-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            border-color: var(--color-accent-gold-dim);
        }

        .blog-date {
            font-size: 0.85rem;
            color: var(--color-accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .blog-card h3 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--color-text-primary);
        }

        .blog-card p {
            color: var(--color-text-secondary);
            font-size: 1rem;
            flex-grow: 1;
            margin-bottom: 1.5rem;
        }

        .read-more {
            color: var(--color-accent-gold);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            align-self: flex-start;
        }
    </style>
</head>

<body>
    <!-- Page Loader -->
    <div class="loader-wrapper">
        <div class="breathing-circle"></div>
    </div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo" id="nav-logo">
                <img src="assets/images/logo.webp" alt="Your Journey Coach" class="logo-img">
            </a>
            <ul class="nav-links" id="nav-links-list">
                <!-- Populated dynamically by js/nav.js from data/nav.json -->
            </ul>
            <div class="hamburger" id="hamburger" aria-label="Open navigation menu" role="button">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <main>
        <!-- Blog List View -->
        <div id="blog-list-view">
            <section class="blog-header">
                <div class="container">
                    <h1 class="reveal-text delay-100">The Journey Blog</h1>
                    <p class="reveal-text delay-200"
                        style="color: var(--color-text-secondary); max-width: 600px; margin: 1rem auto 0 auto;">
                        Thoughts on leadership, self-awareness, and navigating the complexities of organizational life.
                    </p>
                </div>
            </section>

            <section class="container" style="min-height: 400px;">
                <div id="blog-grid" class="blog-grid fade-in-scroll">
                    <!-- Blog cards will be injected here via JavaScript -->
                    <p style="text-align: center; width: 100%; grid-column: 1 / -1; color: var(--color-text-muted);">
                        Loading posts...</p>
                </div>
            </section>
        </div>

    </main>

    <footer
        style="padding: 3rem 0; background: var(--color-bg-primary); border-top: 1px solid rgba(255,255,255,0.05); margin-top: 4rem;">
        <div class="container" style="display: flex; flex-direction: column; align-items: center; gap: 2rem;">
            <!-- Footer Logo -->
            <a href="/">
                <img src="assets/images/logo.webp" alt="Your Journey Coach" class="footer-logo">
            </a>
            <nav id="footer-nav-links" style="display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center;"></nav>
            <p style="color: var(--color-text-muted); font-size: 0.9rem;">&copy; <span id="footer-year"></span> Your Journey Coach. All Rights Reserved.</p>
            <div style="display: flex; gap: 1.5rem;">
                <a href="/privacy.html" style="color: var(--color-text-muted); font-size: 0.8rem; text-decoration: none; transition: color 0.3s ease;" onmouseover="this.style.color='var(--color-accent-gold)'" onmouseout="this.style.color='var(--color-text-muted)'">Privacy Policy</a>
                <a href="/admin" style="color: var(--color-text-muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; transition: color 0.3s ease;"
                    onmouseover="this.style.color='var(--color-accent-gold)'"
                    onmouseout="this.style.color='var(--color-text-muted)'">Admin Login</a>
            </div>
        </div>
    </footer>

    <script src="js/nav.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/blog.js" defer></script>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
</body>

</html>
